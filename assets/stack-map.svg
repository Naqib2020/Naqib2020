      <stop stop-color="#050816"/>
      <stop offset="0.56" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ring" x1="145" y1="120" x2="1030" y2="465" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.35" stop-color="#2DD4BF"/>
      <stop offset="0.7" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F59E0B"/>
