  <text x="64" y="512" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">The goal is not to collect tools. The goal is to ship complete systems that work for customers, admins, and business operations.</text>
</svg>
