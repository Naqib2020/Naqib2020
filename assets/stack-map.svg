<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stackBg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.54" stop-color="#101827"/>
      <stop offset="1" stop-color="#092F2E"/>
    </linearGradient>
    <linearGradient id="stackAccent" x1="84" y1="122" x2="1094" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.3" stop-color="#2DD4BF"/>
      <stop offset="0.65" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="stackDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.3" fill="#FFFFFF" fill-opacity="0.095"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#stackBg)"/>
  <rect width="1200" height="700" rx="24" fill="url(#stackDots)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="72" fill="#BAE6FD" font-size="21" font-weight="800" letter-spacing="4">ENGINEERING STACK</text>
    <text x="64" y="128" fill="#FFFFFF" font-size="42" font-weight="850">A layered stack for full product delivery.</text>
    <text x="64" y="164" fill="#CBD5E1" font-size="18" font-weight="500">Tools are chosen for the product, then organized into reliable layers.</text>
    <text x="64" y="190" fill="#CBD5E1" font-size="18" font-weight="500">The goal is a system that is useful for customers, admins, and business operations.</text>

    <g transform="translate(64 218)">
      <rect width="754" height="404" rx="12" fill="#07111F" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <path d="M36 66H718" stroke="url(#stackAccent)" stroke-width="3" stroke-linecap="round"/>

      <g font-size="15" font-weight="650">
        <rect x="34" y="34" width="686" height="58" rx="8" fill="#082F49" stroke="#38BDF8" stroke-opacity="0.32"/>
        <text x="58" y="69" fill="#E0F2FE" font-size="18" font-weight="850">Experience Layer</text>
        <text x="260" y="69" fill="#CBD5E1">Next.js, React, TypeScript, Tailwind, Flutter</text>

        <rect x="34" y="108" width="686" height="58" rx="8" fill="#042F2E" stroke="#2DD4BF" stroke-opacity="0.32"/>
        <text x="58" y="143" fill="#CCFBF1" font-size="18" font-weight="850">Application Layer</text>
        <text x="260" y="143" fill="#CBD5E1">Laravel, PHP, REST APIs, auth, roles, admin</text>

        <rect x="34" y="182" width="686" height="58" rx="8" fill="#312E81" stroke="#A78BFA" stroke-opacity="0.32"/>
        <text x="58" y="217" fill="#EDE9FE" font-size="18" font-weight="850">Data and Realtime</text>
        <text x="260" y="217" fill="#CBD5E1">Postgres, MySQL, Firebase, realtime, local storage</text>

        <rect x="34" y="256" width="686" height="58" rx="8" fill="#422006" stroke="#F59E0B" stroke-opacity="0.32"/>
        <text x="58" y="291" fill="#FEF3C7" font-size="18" font-weight="850">Business Workflows</text>
        <text x="260" y="291" fill="#CBD5E1">Stripe, invoices, shipping, maps, CMS, localization</text>

        <rect x="34" y="330" width="686" height="44" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.22"/>
        <text x="58" y="358" fill="#E5E7EB" font-size="17" font-weight="850">Delivery Habits</text>
        <text x="260" y="358" fill="#CBD5E1">Git, GitHub, Docker, QA, docs, release fixes</text>
      </g>
    </g>

    <g transform="translate(860 218)">
      <rect width="276" height="404" rx="12" fill="#07111F" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="28" y="48" fill="#FFFFFF" font-size="24" font-weight="850">How I use it</text>
      <text x="28" y="84" fill="#94A3B8" font-size="15" font-weight="650">My stack is not a trophy shelf.</text>
      <text x="28" y="108" fill="#94A3B8" font-size="15" font-weight="650">It is a product delivery system.</text>

      <g font-size="15" font-weight="750">
        <rect x="28" y="146" width="220" height="44" rx="8" fill="#082F49" stroke="#38BDF8" stroke-opacity="0.35"/>
        <text x="48" y="174" fill="#E0F2FE">User workflow first</text>
        <rect x="28" y="206" width="220" height="44" rx="8" fill="#042F2E" stroke="#2DD4BF" stroke-opacity="0.35"/>
        <text x="48" y="234" fill="#CCFBF1">Admin reality matters</text>
        <rect x="28" y="266" width="220" height="44" rx="8" fill="#312E81" stroke="#A78BFA" stroke-opacity="0.35"/>
        <text x="48" y="294" fill="#EDE9FE">Mobile is part of the system</text>
        <rect x="28" y="326" width="220" height="44" rx="8" fill="#422006" stroke="#F59E0B" stroke-opacity="0.35"/>
        <text x="48" y="354" fill="#FEF3C7">Privacy by default</text>
      </g>
    </g>

    <text x="64" y="664" fill="#94A3B8" font-size="15" font-weight="650">The exact framework can change. A coherent product system matters more than a tool list.</text>
  </g>
</svg>
