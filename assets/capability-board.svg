  <text x="64" y="470" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Selected work: B2B auctions, live commerce, marketplaces, scanner apps, hospitality sites, service booking, healthcare content, and booking systems.</text>
