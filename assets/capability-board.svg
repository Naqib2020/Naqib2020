  <text x="64" y="72" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">PROFILE SNAPSHOT</text>
  <text x="64" y="124" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="850">I can build complete products end-to-end.</text>
  <text x="64" y="164" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">The projects below are proof points from real work, not the limit of what I can build.</text>

  <path d="M88 230C206 190 291 197 397 236C509 277 606 338 734 304C846 275 918 193 1098 221" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect x="64" y="214" width="322" height="98" rx="22" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="92" y="252" fill="#E0F2FE" font-size="20" font-weight="800">Product Thinking</text>
      <text x="92" y="282" fill="#CBD5E1" font-size="16">Turn ideas into usable workflows,</text>
      <text x="92" y="304" fill="#CBD5E1" font-size="16">features, data models, and screens.</text>
    </g>
    <g>
      <rect x="439" y="214" width="322" height="98" rx="22" fill="#0F172A" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="467" y="252" fill="#CCFBF1" font-size="20" font-weight="800">Engineering Systems</text>
      <text x="467" y="282" fill="#CBD5E1" font-size="16">Build APIs, dashboards, mobile apps,</text>
      <text x="467" y="304" fill="#CBD5E1" font-size="16">admin panels, and integrations.</text>
    </g>
    <g>
      <rect x="814" y="214" width="322" height="98" rx="22" fill="#0F172A" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.35"/>
      <text x="842" y="252" fill="#FEF3C7" font-size="20" font-weight="800">Launch-Ready Delivery</text>
      <text x="842" y="282" fill="#CBD5E1" font-size="16">Connect auth, payments, realtime,</text>
      <text x="842" y="304" fill="#CBD5E1" font-size="16">notifications, content, and ops.</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
