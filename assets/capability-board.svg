<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snapshotBg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="snapshotAccent" x1="72" y1="80" x2="1126" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.36" stop-color="#2DD4BF"/>
      <stop offset="0.7" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="snapshotGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#snapshotBg)"/>
  <rect width="1200" height="620" rx="24" fill="url(#snapshotGrid)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="72" fill="#BAE6FD" font-size="21" font-weight="800" letter-spacing="4">PROFILE SNAPSHOT</text>
    <text x="64" y="124" fill="#FFFFFF" font-size="41" font-weight="850">I build across the whole product surface.</text>
    <text x="64" y="162" fill="#CBD5E1" font-size="18" font-weight="500">Selected projects are evidence from real work, not boundaries.</text>
    <text x="64" y="188" fill="#CBD5E1" font-size="18" font-weight="500">I can shape the product, architecture, web, mobile, backend, admin, and integrations around the business problem.</text>

    <g transform="translate(64 238)">
      <rect width="320" height="254" rx="12" fill="#07111F" stroke="#38BDF8" stroke-opacity="0.28"/>
      <text x="28" y="46" fill="#E0F2FE" font-size="24" font-weight="850">Product ownership</text>
      <text x="28" y="83" fill="#CBD5E1" font-size="16">I can take a product from rough</text>
      <text x="28" y="106" fill="#CBD5E1" font-size="16">business idea to architecture, UI,</text>
      <text x="28" y="129" fill="#CBD5E1" font-size="16">backend, mobile, admin tools, and</text>
      <text x="28" y="152" fill="#CBD5E1" font-size="16">production workflows.</text>
      <rect x="28" y="184" width="104" height="34" rx="8" fill="#082F49" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="48" y="207" fill="#E0F2FE" font-size="14" font-weight="750">Plan</text>
      <rect x="144" y="184" width="72" height="34" rx="8" fill="#042F2E" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="165" y="207" fill="#CCFBF1" font-size="14" font-weight="750">Build</text>
      <rect x="228" y="184" width="64" height="34" rx="8" fill="#422006" stroke="#F59E0B" stroke-opacity="0.35"/>
      <text x="244" y="207" fill="#FEF3C7" font-size="14" font-weight="750">Ship</text>
    </g>

    <g transform="translate(420 238)">
      <rect width="716" height="254" rx="12" fill="#07111F" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="28" y="46" fill="#FFFFFF" font-size="24" font-weight="850">How I usually turn work into a real system</text>
      <path d="M62 126H654" stroke="url(#snapshotAccent)" stroke-width="3" stroke-linecap="round"/>

      <g font-size="14" font-weight="750">
        <rect x="28" y="88" width="145" height="94" rx="10" fill="#082F49" stroke="#38BDF8" stroke-opacity="0.35"/>
        <text x="50" y="120" fill="#E0F2FE">01 Product</text>
        <text x="50" y="147" fill="#CBD5E1" font-weight="500">flows, scope, UX</text>

        <rect x="198" y="88" width="145" height="94" rx="10" fill="#042F2E" stroke="#2DD4BF" stroke-opacity="0.35"/>
        <text x="220" y="120" fill="#CCFBF1">02 System</text>
        <text x="220" y="147" fill="#CBD5E1" font-weight="500">APIs, data, roles</text>

        <rect x="368" y="88" width="145" height="94" rx="10" fill="#312E81" stroke="#A78BFA" stroke-opacity="0.35"/>
        <text x="390" y="120" fill="#EDE9FE">03 Interfaces</text>
        <text x="390" y="147" fill="#CBD5E1" font-weight="500">web, mobile, admin</text>

        <rect x="538" y="88" width="145" height="94" rx="10" fill="#422006" stroke="#F59E0B" stroke-opacity="0.35"/>
        <text x="560" y="120" fill="#FEF3C7">04 Launch</text>
        <text x="560" y="147" fill="#CBD5E1" font-weight="500">ops, realtime, pay</text>
      </g>

      <text x="28" y="218" fill="#94A3B8" font-size="15" font-weight="650">The portfolio shows systems, not only components:</text>
      <text x="28" y="240" fill="#94A3B8" font-size="15" font-weight="650">users, admins, data, permissions, rules, and operations.</text>
    </g>

    <g transform="translate(64 522)" font-size="15" font-weight="800">
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#082F49" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="25" y="25" fill="#E0F2FE">Auctions</text>
      <rect x="146" y="0" width="138" height="38" rx="8" fill="#042F2E" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="174" y="25" fill="#CCFBF1">Commerce</text>
      <rect x="300" y="0" width="152" height="38" rx="8" fill="#312E81" stroke="#A78BFA" stroke-opacity="0.35"/>
      <text x="324" y="25" fill="#EDE9FE">Marketplaces</text>
      <rect x="468" y="0" width="122" height="38" rx="8" fill="#422006" stroke="#F59E0B" stroke-opacity="0.35"/>
      <text x="495" y="25" fill="#FEF3C7">Booking</text>
      <rect x="606" y="0" width="146" height="38" rx="8" fill="#0F172A" stroke="#34D399" stroke-opacity="0.35"/>
      <text x="634" y="25" fill="#D1FAE5">Scanner Ops</text>
      <rect x="768" y="0" width="142" height="38" rx="8" fill="#172554" stroke="#60A5FA" stroke-opacity="0.35"/>
      <text x="795" y="25" fill="#DBEAFE">Hospitality</text>
      <rect x="926" y="0" width="210" height="38" rx="8" fill="#3B0764" stroke="#C084FC" stroke-opacity="0.35"/>
      <text x="958" y="25" fill="#F3E8FF">Service and Content</text>
    </g>
  </g>
</svg>
